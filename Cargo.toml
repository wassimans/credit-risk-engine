[package]
name = "credit-risk-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.4.0"
rayon = "1.12.0"
rust_decimal = { version = "1.43.0", features = ["serde-with-str"] }
rust_decimal_macros = "1.40.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.12.0"

[[bench]]
name = "portfolio"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
